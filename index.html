<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organizador Marco 2.6</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="container center-screen">
    <section class="card login-card">
      <h1>📘 Organizador Marco 2.6</h1>

      <p>Ingreso libre en fase de construcción. Puedes dejar los campos vacíos.</p>

      <label for="roleSelect">Modo de ingreso</label>
      <select id="roleSelect">
        <option value="admin">Administrador</option>
        <option value="student">Alumno</option>
      </select>

      <label for="userInput">Teléfono / Usuario</label>
      <input id="userInput" placeholder="Opcional" />

      <label for="passwordInput">Contraseña</label>
      <input id="passwordInput" type="password" placeholder="Opcional" />

      <button id="loginBtn" class="btn primary full">Entrar</button>

      <button 
        class="btn secondary full" 
        onclick="location.href='pages/registro.html'"
      >
        Registrarse
      </button>
    </section>
  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>

  <!-- Estado local temporal -->
  <script src="js/data.js"></script>

  <!-- Login -->
  <script src="js/app.js"></script>
</body>
</html>
